{% extends "vertical.html" %}
{% load erp_forms %}

{% block title %}
  {{ page_title }}
{% endblock title %}
{% block page_content %}
  <div class="container-fluid">
    <div class="py-3">
      <h4 class="fs-18 fw-semibold m-0">{{ page_title }}</h4>
    </div>
    <div class="card">
      <div class="card-body">
        <form method="post" class="erp-form" novalidate>
          {% csrf_token %}{% erp_form_fields form %}
          <button type="submit" class="btn btn-warning">Redefinir senha</button>
          <button type="button" class="btn btn-light" onclick="history.back()">Cancelar</button>
        </form>
      </div>
    </div>
  </div>
{% endblock page_content %}
