{% extends "erp/list_base.html" %}
{% block table_content %}
<div class="table-responsive"><table class="table table-hover align-middle mb-0">
  <thead><tr><th>Code</th><th>Display Name</th><th>Phone</th><th>Email</th><th>Is Active</th></tr></thead>
  <tbody>{% for item in page_obj %}<tr><td>{{ item.code }}</td><td>{{ item.display_name }}</td><td>{{ item.phone }}</td><td>{{ item.email }}</td><td>{{ item.is_active }}</td></tr>{% empty %}<tr><td colspan="5" class="text-muted">Nenhum registro encontrado.</td></tr>{% endfor %}</tbody>
</table></div>
{% endblock table_content %}
