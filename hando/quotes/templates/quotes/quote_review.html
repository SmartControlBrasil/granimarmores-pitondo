{% extends "vertical.html" %}

{% block title %}
  {{ page_title }}
{% endblock title %}
{% block page_content %}
  <div class="container-fluid">
    <div class="py-3">
      <h4 class="fs-18 fw-semibold m-0">{{ page_title }}</h4>
    </div>
    <div class="card">
      <div class="card-body">
        <p>Total: R$ {{ quote.grand_total }} | Margem: {{ quote.gross_margin_percentage }}%</p>
        <form method="post">
          {% csrf_token %}{{ form.as_p }}
          <button type="submit" class="btn btn-primary">Enviar para fluxo</button>
        </form>
      </div>
    </div>
  </div>
{% endblock page_content %}
