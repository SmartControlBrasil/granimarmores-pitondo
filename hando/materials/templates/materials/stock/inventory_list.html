{% extends "erp/list_base.html" %}
{% block card_actions %}<a href="{% url 'stock:inventory_create' %}" class="btn btn-sm btn-primary">Novo</a>{% endblock card_actions %}
{% block table_content %}
<div class="table-responsive"><table class="table table-sm"><thead><tr><th>Número</th><th>Local</th><th>Status</th><th></th></tr></thead><tbody>
{% for inv in page_obj %}<tr><td><a href="{% url 'stock:inventory_detail' inv.pk %}">{{ inv.number }}</a></td><td>{{ inv.location }}</td><td>{{ inv.get_status_display }}</td><td><a href="{% url 'stock:inventory_detail' inv.pk %}">Abrir</a></td></tr>{% empty %}<tr><td colspan="4" class="text-muted">Sem inventários.</td></tr>{% endfor %}
</tbody></table></div>
{% endblock table_content %}
