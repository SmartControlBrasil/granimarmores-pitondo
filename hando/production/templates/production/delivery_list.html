{% extends "erp/list_base.html" %}

{% block table_content %}
  <div class="table-responsive">
    <table class="table table-hover mb-0">
      <thead><tr><th>Pedido</th><th>Data</th><th>Status</th></tr></thead>
      <tbody>
        {% for row in page_obj %}
          <tr>
            <td><a href="{% url 'operacao:order_detail' row.sales_order.pk %}">{{ row.sales_order.number }}</a></td>
            <td>{{ row.scheduled_date }}</td>
            <td>{{ row.get_status_display }}</td>
          </tr>
        {% empty %}
          <tr><td colspan="3" class="text-muted">Nenhum registro.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
{% endblock table_content %}
