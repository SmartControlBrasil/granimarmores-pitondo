{% extends "erp/list_base.html" %}

{% block table_content %}
  <div class="table-responsive">
    <table class="table table-hover mb-0">
      <thead><tr><th>Peça</th><th>Etapa</th><th>Status</th><th>Responsável</th></tr></thead>
      <tbody>
        {% for row in page_obj %}
          <tr>
            <td>{{ row.piece.code }}</td>
            <td>{{ row.stage.name }}</td>
            <td>{{ row.get_status_display }}</td>
            <td>{{ row.assigned_to|default:"-" }}</td>
          </tr>
        {% empty %}
          <tr><td colspan="4" class="text-muted">Nenhuma peça em produção.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
{% endblock table_content %}
