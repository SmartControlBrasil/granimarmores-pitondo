{% extends "vertical.html" %}

{% block title %}
  {{ page_title }}
{% endblock title %}
{% block page_content %}
  <div class="container-fluid">
    <div class="py-3">
      <h4 class="fs-18 fw-semibold m-0">{{ page_title }}</h4>
    </div>
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'info' }}" role="alert">{{ message }}</div>
      {% endfor %}
    {% endif %}
    <div class="card">
      <div class="card-body">
        <p class="mb-4">{{ message }}</p>
        <form method="post">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">Confirmar</button>
          <button type="button" class="btn btn-light" onclick="history.back()">Cancelar</button>
        </form>
      </div>
    </div>
  </div>
{% endblock page_content %}
