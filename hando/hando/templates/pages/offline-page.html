{% extends 'base.html' %}

{% load static %}

{% block title %}Offline Page{% endblock title %}

{% block extra_css %}{% endblock extra_css %}

{% block content %}

<body class="maintenance-bg-image">
    
    <div class="maintenance-pages">
        <div class="container-fluid p-0">
            <div class="row">

                <div class="col-xl-12 align-self-center">
                    <div class="row">
                        <div class="col-md-5 mx-auto">
                            <div class="text-center">

                                <div class="text-center">
                                    <h3 class="mt-4 fw-semibold text-dark text-capitalize">You are offline</h3>
                                    <p class="text-muted">Internet connection is lost. Try checking the <br> signal and refresh the screen later.</p>
                                </div>

                                <a class="btn btn-primary mt-3 me-1" href="/">Back to Home</a>

                                <div class="error-page mt-4">
                                    <img src="{% static '/images/svg/offline.svg' %}" class="img-fluid" alt="coming-soon">
                                </div>

                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <!-- END wrapper -->

{% endblock content %}
