{% extends "base.html" %}

{% load static %}

{% block title %}Error 500{% endblock title %}

{% block extra_css %}{% endblock %}

{% block content %}

<body class="maintenance-bg-image">

    <!-- Begin page -->
    <div class="maintenance-pages">
        <div class="container-fluid p-0">
            <div class="row">

                <div class="col-xl-12 align-self-center">
                    <div class="row">
                        <div class="col-md-5 mx-auto">
                            <div class="text-center">

                                <div class="mb-0">
                                    <h3 class="fw-semibold text-dark text-capitalize">Internal Server Error</h3>
                                    <p class="text-muted">Our internal server has gone on a uninformed vacation</p>
                                </div>

                                <a class="btn btn-primary mt-3 me-1" href="/">Back to Home</a>

                                <div class="maintenance-img mt-4">
                                    <img src="{% static '/images/svg/500-error.svg' %}" class="img-fluid" alt="coming-soon">
                                </div>

                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <!-- END wrapper -->
{% endblock content %}
