{% extends "erp/list_base.html" %}
{% block table_content %}
<div class="table-responsive"><table class="table table-hover align-middle mb-0">
  <thead><tr><th>Asset Code</th><th>Name</th><th>Category</th><th>Status</th><th>Is Active</th></tr></thead>
  <tbody>{% for item in page_obj %}<tr><td>{{ item.asset_code }}</td><td>{{ item.name }}</td><td>{{ item.category }}</td><td>{{ item.status }}</td><td>{{ item.is_active }}</td></tr>{% empty %}<tr><td colspan="5" class="text-muted">Nenhum registro encontrado.</td></tr>{% endfor %}</tbody>
</table></div>
{% endblock table_content %}
