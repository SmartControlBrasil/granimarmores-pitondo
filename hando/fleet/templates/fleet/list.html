{% extends "erp/list_base.html" %}
{% block table_content %}
<div class="table-responsive"><table class="table table-hover align-middle mb-0">
  <thead><tr><th>Plate</th><th>Brand</th><th>Model</th><th>Odometer</th><th>Status</th></tr></thead>
  <tbody>{% for item in page_obj %}<tr><td>{{ item.plate }}</td><td>{{ item.brand }}</td><td>{{ item.model }}</td><td>{{ item.odometer }}</td><td>{{ item.status }}</td></tr>{% empty %}<tr><td colspan="5" class="text-muted">Nenhum registro encontrado.</td></tr>{% endfor %}</tbody>
</table></div>
{% endblock table_content %}
