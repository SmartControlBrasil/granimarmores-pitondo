{% extends "vertical.html" %}
{% load crispy_forms_tags %}
{% block title %}{{ page_title }}{% endblock title %}
{% block page_content %}
<div class="container-fluid">
  <h4 class="fs-18 fw-semibold py-3">{{ page_title }}</h4>
  <div class="card"><div class="card-body">
    <form method="post" enctype="multipart/form-data">{% csrf_token %}{% crispy form %}
      <button class="btn btn-primary" type="submit">Salvar</button>
      {% if cancel_url %}<a class="btn btn-light" href="{% url cancel_url %}">Cancelar</a>{% endif %}
    </form>
  </div></div>
</div>
{% endblock page_content %}
