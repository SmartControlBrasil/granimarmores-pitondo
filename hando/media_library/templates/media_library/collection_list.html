{% extends "erp/list_base.html" %}
{% block card_actions %}<a href="{% url 'media_library:collection_create' %}" class="btn btn-sm btn-primary">Nova coleção</a>{% endblock %}
{% block table_content %}
<table class="table table-sm"><thead><tr><th>Código</th><th>Nome</th><th>Tipo</th><th>Status</th></tr></thead><tbody>
{% for c in page_obj %}<tr><td><a href="{% url 'media_library:collection_detail' c.pk %}">{{ c.code }}</a></td><td>{{ c.name }}</td><td>{{ c.get_collection_type_display }}</td><td>{{ c.get_status_display }}</td></tr>
{% empty %}<tr><td colspan="4" class="text-muted">Nenhuma coleção.</td></tr>{% endfor %}
</tbody></table>
{% endblock %}
