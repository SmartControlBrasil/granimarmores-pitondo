{% extends "erp/list_base.html" %}
{% block table_content %}
<div class="row g-3">{% for asset in page_obj %}
<div class="col-md-3"><a href="{% url 'media_library:asset_detail' asset.pk %}">{{ asset.code }}</a><div class="small">{{ asset.get_status_display }} · {{ asset.uploaded_at|date:"d/m/Y" }}</div></div>
{% empty %}<p class="text-muted">Sem mídias.</p>{% endfor %}</div>
{% endblock %}
