{% extends "backoffice/base.html" %}
{% block title %}Novo orçamento{% endblock %}
{% block page_content %}<h1 class="h3 mb-3">Novo orçamento</h1><p class="text-muted">{{ opportunity.customer_name }} · {{ opportunity.title }}</p><form method="post" class="card card-body">{% csrf_token %}<label class="form-label">Validade</label>{{ form.validity_date }}<label class="form-label mt-2">Observações</label>{{ form.notes }}<button class="btn mt-3" type="submit">Criar orçamento</button></form>{% endblock %}
