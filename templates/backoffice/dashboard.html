{% extends "backoffice/base.html" %}

{% block title %}Dashboard{% endblock %}
{% block page_content %}
<div class="py-3 d-flex align-items-sm-center flex-sm-row flex-column">
    <div class="flex-grow-1">
        <h4 class="fs-18 fw-semibold m-0">Dashboard</h4>
        <ol class="breadcrumb m-0 py-1">
            <li class="breadcrumb-item active">Painel Operacional</li>
        </ol>
    </div>
    <div class="text-end"><a href="{% url 'backoffice:lead_list' %}" class="btn btn-primary"><i data-feather="users" class="me-1"></i> Ver leads</a></div>
</div>
<div class="row">
    {% for card in cards %}
        <div class="col-md-6 col-lg-4 col-xl-3">
            <div class="card">
                <div class="card-body">
                    <div class="widget-first">
                        <div class="d-flex align-items-center mb-2">
                            <div class="p-2 border border-primary border-opacity-10 bg-primary-subtle rounded-2 me-2">
                                <div class="bg-primary rounded-circle widget-size text-center">
                                    <i data-feather="bar-chart-2" class="text-white"></i>
                                </div>
                            </div>
                            <p class="mb-0 text-dark fs-15">{{ card.label }}</p>
                        </div>
                        <h3 class="mb-0 fs-22 text-dark">{{ card.value }}</h3>
                    </div>
                </div>
            </div>
        </div>
    {% endfor %}
</div>
{% endblock %}
