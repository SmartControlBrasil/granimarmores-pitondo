{% load static %}
<div class="topbar-custom">
  <div class="container-fluid">
    <div class="d-flex justify-content-between">
      <ul class="list-unstyled topnav-menu mb-0 d-flex align-items-center">
        <li><button class="button-toggle-menu nav-link"><i data-feather="menu" class="noti-icon"></i></button></li>
        <li class="d-none d-lg-block"><h5 class="mb-0">Olá, {{ request.user.get_full_name|default:request.user.get_username }}</h5></li>
      </ul>
      <ul class="list-unstyled topnav-menu mb-0 d-flex align-items-center">
        <li class="d-none d-sm-flex"><button type="button" class="btn nav-link" data-toggle="fullscreen"><i data-feather="maximize" class="align-middle fullscreen noti-icon"></i></button></li>
        <li class="d-none d-sm-flex"><button type="button" class="btn nav-link" id="light-dark-mode"><i data-feather="moon" class="align-middle dark-mode"></i><i data-feather="sun" class="align-middle light-mode"></i></button></li>
        <li class="dropdown notification-list topbar-dropdown">
          <a class="nav-link dropdown-toggle nav-user me-0" data-bs-toggle="dropdown" href="#" role="button" aria-haspopup="false" aria-expanded="false">
            <img src="{% static 'images/users/profile.jpg' %}" alt="user-image" class="rounded-circle" />
            <span class="pro-user-name ms-1">{{ request.user.get_full_name|default:request.user.get_username }} <i class="mdi mdi-chevron-down"></i></span>
          </a>
          <div class="dropdown-menu dropdown-menu-end profile-dropdown">
            <div class="dropdown-header noti-title">
              <h6 class="text-overflow m-0">{{ request.user.get_username }}</h6>
              <small class="text-muted">{{ backoffice_role_label }}</small>
            </div>
            <a href="{% url 'backoffice:profile' %}" class="dropdown-item notify-item"><i class="mdi mdi-account-circle-outline fs-16 align-middle"></i><span>Meu Perfil</span></a>
            <div class="dropdown-divider"></div>
            <form method="post" action="{% url 'backoffice:logout' %}">
              {% csrf_token %}
              <button type="submit" class="dropdown-item notify-item"><i class="mdi mdi-location-exit fs-16 align-middle"></i><span>Sair</span></button>
            </form>
          </div>
        </li>
      </ul>
    </div>
  </div>
</div>
